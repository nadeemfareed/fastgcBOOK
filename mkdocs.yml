site_name: FAST-GC Book
site_description: Practical FAST-GC LiDAR processing guide
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.superfences

nav:
  - Home: index.md
  - Introduction: 01-introduction/index.md
  - FAST-GIS: 02-fast-gis/index.md
  - Ground Classification: 03-ground-classification/index.md
  - Products: 04-products/index.md
  - Examples: 05-case-studies/index.md
  - Command Reference: 06-reference/index.md
