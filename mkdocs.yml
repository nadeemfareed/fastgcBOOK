site_name: FAST-GC Book
site_description: Practical FAST-GC LiDAR processing guide
docs_dir: docs
theme:
  name: material
  features:
  - navigation.sections
  - navigation.indexes
  - navigation.top
  - search.highlight
  - content.code.copy
  - navigation.instant
  - navigation.instant.progress
  - navigation.path
  - navigation.footer
  - toc.follow
  - search.suggest
plugins:
- search
- glightbox
markdown_extensions:
- admonition
- tables
- attr_list
- pymdownx.superfences
nav:
- Home: index.md
- 'Chapter 1: Introduction': 01-introduction/index.md
- 'Chapter 2: Cross-Platform Installation, Configuration, and Performance': 02-installation/index.md
- 'Chapter 3: FAST-GIS': 02-fast-gis/index.md
- 'Chapter 4: Ground Classification': 03-ground-classification/index.md
- 'Chapter 5: Products': 04-products/index.md
- 'Chapter 6: Examples': 05-case-studies/index.md
- 'Chapter 7: Command Reference': 06-reference/index.md
extra_css:
- stylesheets/fastgc-book.css
site_url: https://nadeemfareed.github.io/fastgcBOOK/
extra_javascript:
- javascripts/fastgc-navigation.js
