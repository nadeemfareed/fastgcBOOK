site_name: FAST-GC Book
site_description: Scientific foundations and applications of FAST-GC
site_url: ""
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Introduction: 01-introduction/index.md
  - FAST-GIS: 02-fast-gis/index.md
  - Ground Classification: 03-ground-classification/index.md
  - Products: 04-products/index.md
  - Case Studies: 05-case-studies/index.md
  - Reference: 06-reference/index.md
